name: Rufus private model auth tests

on:
  pull_request:
    paths:
      - "security/rufus-model-bridge.mjs"
      - "security/rufus-model-bridge.test.mjs"
      - ".github/workflows/rufus-model-auth-test.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check OIDC signature and restrictive claims
        run: node --test security/rufus-model-bridge.test.mjs
