name: Test Animal Zoo
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build worker
        run: node scripts/build.mjs
      - name: Run tests
        run: node scripts/test.mjs
      - name: Validate Blender script syntax
        run: python3 -c "import ast; from pathlib import Path; ast.parse(Path('scripts/rig_rufus.py').read_text())"
