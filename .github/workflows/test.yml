name: Test Animal Zoo
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build worker
        run: node scripts/build.mjs
      - name: Run tests
        run: node scripts/test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-rig.txt
      - name: Test rig builder on a synthetic fox
        run: python3 -m unittest discover -s scripts -p "test_rig_*.py"
