<!doctype html><html lang="en"><meta charset="utf-8"><title>Rufus local visual QA</title><style>body{background:#182226;color:white;font:16px system-ui}button{padding:12px;margin:4px}iframe{display:block;height:850px;border:1px solid #789;max-width:100%}</style><h1>Local QA — no AI session</h1><p>Viewport fixtures and synthetic animation signals. These controls are only served by the development server.</p><button data-width="390">Phone 390 px</button><button data-width="768">Tablet 768 px</button><button data-state="idle">Idle</button><button data-state="is-listening">Listening</button><button data-state="is-thinking">Thinking</button><button data-state="is-speaking">Speaking</button><button id="lose">Lose WebGL context</button><button id="restore">Restore WebGL context</button><iframe title="Animal Zoo viewport" src="/" width="390"></iframe><script>
const frame=document.querySelector('iframe');let extension;
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.width=b.dataset.width);
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const stage=frame.contentDocument.getElementById('stage');stage.className='stage fox '+(b.dataset.state==='idle'?'':b.dataset.state);stage.style.setProperty('--mouth-open',b.dataset.state==='is-speaking'?'1.0':'.16');stage.scrollIntoView({block:'start'})});
document.getElementById('lose').onclick=()=>{extension=frame.contentDocument.querySelector('canvas')?.getContext('webgl2')?.getExtension('WEBGL_lose_context');extension?.loseContext()};document.getElementById('restore').onclick=()=>extension?.restoreContext();
</script></html>
